[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-omni-dropship-pod-engine"
version = "1.0.0"
description = "Zero-touch multi-supplier Shopify dropship and POD fulfillment engine (CJ + Printify/Printful)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nexus-ecom = "nexus_engine.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
